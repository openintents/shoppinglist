AutoName: OI Shopping List
# Summary, description, changelogs and icon come from fastlane/metadata/android/.

RepoType: git
Repo: https://github.com/openintents/shoppinglist

Builds:
  - versionName: 2.0.3
    versionCode: 100203
    commit: 2.0.3
    subdir: ShoppingList
    gradle:
      - tstore
    prebuild:
      - sed -i -e '96,97 d' -e '78,82 d' -e '28,45 d' build.gradle
      - sed -i '/non-FOSS/,/non-FOSS-end/ d' src/main/AndroidManifest.xml
      - rm -rf ../ShoppingListWear
      - sed -i '/ShoppingListWear/ d' ../settings.gradle
      - rm -rf libs

  - versionName: 2.1.3
    versionCode: 100213
    commit: v2.1.3
    subdir: ShoppingList
    gradle:
      - tstore
    prebuild:
      - sed -i -e '/Properties local_properties/,+4d' build.gradle
      - rm -rf ../ShoppingListWear
      - sed -i '/ShoppingListWear/ d' ../settings.gradle
      - rm -rf libs

  # Last legacy (AGP 4 / support-library) release. Builds from source no longer
  # resolve (jcenter is dead), so this is kept only as the historical record and
  # as the AutoUpdate template. From the AGP 8 / AndroidX rework onward the build
  # needs NO prebuild patching (settings.gradle has no Wear ref, gradle.properties
  # ships the AndroidX/Jetifier flags, signing is guarded by build-private.properties),
  # so the sed/rm lines below are harmless no-ops on newer tags when cloned.
  - versionName: 2.2.1
    versionCode: 100221
    commit: v2.2.1
    subdir: ShoppingList
    gradle:
      - tstore
    prebuild:
      - sed -i -e '/Properties local_properties/,+4d' build.gradle
      - rm -rf ../ShoppingListWear
      - sed -i '/ShoppingListWear/ d' ../settings.gradle

  # AGP 8 / AndroidX / targetSdk 35. Builds as-is: no prebuild patching needed.
  - versionName: 2.3.0
    versionCode: 100230
    commit: v2.3.0
    subdir: ShoppingList
    gradle:
      - tstore

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
