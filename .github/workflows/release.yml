name: Release

# Push a tag like v2.3.0 to build a signed APK, publish it as a GitHub release
# (the source for Obtainium) and to Zapstore. F-Droid builds the same tag itself.
#
# Repository secrets:
#   KEYSTORE_BASE64    base64 of the release keystore (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
#   ZAPSTORE_SIGN_WITH optional: nsec or NIP-46 bunker URL of the Zapstore publisher

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets to sign releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ShoppingList/release.jks
          {
            echo "key.store=release.jks"
            echo "key.store.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.alias.password=$KEY_PASSWORD"
          } > ShoppingList/build-private.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :ShoppingList:testPlayDebugUnitTest

      - name: Build signed APK
        run: ./gradlew --no-daemon :ShoppingList:assembleTstoreRelease

      - name: Release notes
        id: notes
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' ShoppingList/build.gradle)
          cp "fastlane/metadata/android/en-US/changelogs/$CODE.txt" release-notes.txt

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: ShoppingList/build/outputs/apk/tstore/release/*.apk

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SIGN_WITH != ''
        run: |
          git clone --depth 1 https://github.com/zapstore/zsp /tmp/zsp
          (cd /tmp/zsp && go build -o /tmp/zsp-bin .)
          /tmp/zsp-bin publish -q zapstore.yaml
