name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :ShoppingList:testPlayDebugUnitTest
      - name: Build release APK (F-Droid flavor) and AAB (Play)
        run: ./gradlew --no-daemon :ShoppingList:assembleTstoreRelease :ShoppingList:bundlePlayRelease
      - name: Lint
        run: ./gradlew --no-daemon :ShoppingList:lintPlayRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            ShoppingList/build/outputs/apk/
            ShoppingList/build/outputs/bundle/
            ShoppingList/build/reports/
